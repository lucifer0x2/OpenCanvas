apiVersion: v1
kind: ConfigMap
metadata:
  name: opencanvas
data:
  DATABASE_PROVIDER: postgresql
  DATABASE_POOL_SIZE: "4"
  DATABASE_CONNECT_TIMEOUT_MS: "3000"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"
  DATABASE_LOCK_TIMEOUT_MS: "3000"
  DATABASE_OPERATION_TIMEOUT_MS: "30000"
  PORT: "3857"
  TMPDIR: /tmp

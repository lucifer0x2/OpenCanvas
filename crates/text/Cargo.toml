[package]
name = "opencanvas-text"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
opencanvas-layout = { path = "../layout" }
harfrust = "=0.15.0"
skrifa = "=0.49.0"
read-fonts = "=0.46.0"
sha2 = "0.10"
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.26"
unicode-case-mapping = "=1.0.0"
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }

[dev-dependencies]
brotli = "=8.0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }

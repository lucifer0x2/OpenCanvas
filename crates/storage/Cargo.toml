[package]
name = "opencanvas-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
fault-injection = []

[dependencies]
opencanvas-scene-input = { path = "../scene-input", features = ["sqlite-errors"] }
opencanvas-layout = { path = "../layout" }
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"
tar = "0.4"
tempfile = "3"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
moka = { version = "=0.12.15", default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3"


[package]
name = "opencanvas-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
fault-injection = []

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"


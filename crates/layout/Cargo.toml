[package]
name = "opencanvas-layout"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }

[[bin]]
name = "layout-step"
path = "src/main.rs"

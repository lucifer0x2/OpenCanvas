[package]
name = "opencanvas-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
opencanvas-storage = { path = "../storage" }
axum = "0.8.8"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.4.0", features = ["server", "transport-streamable-http-server"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
async-stream = "0.3"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = "0.41.0"

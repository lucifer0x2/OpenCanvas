[package]
name = "rust-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
harfrust = "=0.15.0"
skrifa = "=0.49.0"
tiny-skia = "=0.12.0"
png = "=0.18.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1"
# Part D (end-to-end bench): the real layout crate, plus what the server path does per job.
opencanvas-layout = { path = "../../crates/layout" }
sha2 = "0.10"
base64 = "0.22"
rayon = { version = "=1.12.0", optional = true }

[target.'cfg(unix)'.dependencies]
# getrusage for the CPU time per bench run (all threads), next to wall time.
libc = "0.2"

[features]
default = ["parallel"]
# Rayon data parallelism in the painter and PNG demultiply (src/par.rs). Off for wasm32 without
# threads: every helper then runs the same closure in order, with byte-identical output.
parallel = ["dep:rayon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]

[package]
name = "rust-spike"
version = "0.1.0"
edition = "2021"

# Task 09: the painter (src/lib.rs) builds for native and wasm32-unknown-unknown; the CLI (src/main.rs)
# and everything only it needs sit behind the default `cli` feature. wasm/ depends on the lib with
# `default-features = false` (no rayon, no layout crate, no sha2/libc).
[lib]
name = "rust_spike"
path = "src/lib.rs"

[[bin]]
name = "rust-spike"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
harfrust = "=0.15.0"
skrifa = "=0.49.0"
tiny-skia = "=0.12.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = { version = "=1.12.0", optional = true }
png = { version = "=0.18.1", optional = true }
unicode-segmentation = { version = "1", optional = true }
# Part D (end-to-end bench): the real layout crate, plus what the server path does per job.
opencanvas-layout = { path = "../../crates/layout", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
# getrusage for the CPU time per bench run (all threads), next to wall time.
libc = { version = "0.2", optional = true }

[features]
default = ["parallel", "cli"]
# Rayon data parallelism in the painter and PNG demultiply (src/par.rs). Off for wasm32 without
# threads: every helper then runs the same closure in order, with byte-identical output.
parallel = ["dep:rayon"]
# The spike CLI binary and its file/bench/layout dependencies.
cli = ["dep:png", "dep:unicode-segmentation", "dep:opencanvas-layout", "dep:sha2", "dep:base64", "dep:libc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]

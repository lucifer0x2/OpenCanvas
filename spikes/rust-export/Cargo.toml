[package]
name = "rust-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
harfrust = "=0.15.0"
skrifa = "=0.49.0"
tiny-skia = "=0.12.0"
png = "=0.18.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]

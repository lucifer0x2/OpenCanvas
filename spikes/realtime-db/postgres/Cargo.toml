[package]
name = "oc-spike-postgres"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
compat-v2 = []

[dependencies]
oc_spike_core = { path = "../core" }
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
